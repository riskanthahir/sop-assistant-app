name: Ingest SOP PDFs

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'sops/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --omit=dev --no-package-lock --no-audit --no-fund

      - name: Run incremental SOP ingest
        id: ingest
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EMBED_MODEL: ${{ vars.EMBED_MODEL || 'gemini-embedding-2' }}
        run: |
          set +e
          node scripts/ingest.mjs
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish ingest report to Action Summary
        if: always()
        run: |
          if [ -f data/ingest-report.md ]; then
            cat data/ingest-report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit updated SOP search data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "chore(sop): update indexed SOP data [skip ci]"
            git push
          else
            echo "No changes to data/ to commit."
          fi

      - name: Fail if ingest stopped or errored
        if: steps.ingest.outputs.exit_code != '0'
        run: |
          echo "Ingest exited with code ${{ steps.ingest.outputs.exit_code }}. Partial progress (if quota paused) has been committed; re-run this workflow to resume."
          exit ${{ steps.ingest.outputs.exit_code }}
